name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hamrooz
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hamrooz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hamrooz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hamrooz:ci-only@localhost:5432/hamrooz_test
      TEST_DATABASE_URL: postgresql://hamrooz:ci-only@localhost:5432/hamrooz_test
      E2E_DATABASE_URL: postgresql://hamrooz:ci-only@localhost:5432/hamrooz_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      - name: create e2e database
        run: PGPASSWORD=ci-only psql -h localhost -U hamrooz -d hamrooz_test -c 'create database hamrooz_e2e'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
